<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body>
<div id="status">Diagnosing 7 Real Images...</div>
<script type="module">
async function log(msg, data) {
  await fetch('/test-log', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ msg, data })
  }).catch(() => {});
}

function analyzeImageLines(bmp, id, cropTop = 32, cropBottom = 32) {
  const validW = bmp.width;
  const validH = bmp.height - cropTop - cropBottom;

  const osc = new OffscreenCanvas(validW, validH);
  const ctx = osc.getContext('2d');
  ctx.drawImage(bmp, 0, cropTop, validW, validH, 0, 0, validW, validH);
  const imgData = ctx.getImageData(0, 0, validW, validH);
  const data = imgData.data;

  // 1. Ink array and vertical projection
  const ink = new Float32Array(validW * validH);
  const hProj = new Float32Array(validH);

  for (let y = 0; y < validH; y++) {
    let rowInk = 0;
    const rowOffset = y * validW;
    for (let x = 0; x < validW; x++) {
      const idx = (rowOffset + x) * 4;
      const r = data[idx], g = data[idx+1], b = data[idx+2];
      const avg = (r + g + b) / 3;
      const diff = Math.max(r, g, b) - Math.min(r, g, b);
      let val = 0;
      if (avg < 200) {
        val = 255 - avg;
      } else if (diff > 25) {
        val = diff * 1.5;
      }
      ink[rowOffset + x] = val;
      rowInk += val;
    }
    hProj[y] = rowInk / validW;
  }

  // 2. Locate line bands (contiguous regions where hProj > 8)
  const lines = [];
  let inLine = false;
  let lineStart = 0;
  for (let y = 0; y < validH; y++) {
    if (hProj[y] > 8) {
      if (!inLine) {
        inLine = true;
        lineStart = y;
      }
    } else {
      if (inLine) {
        inLine = false;
        if (y - lineStart >= 6) {
          // Find peak inside line
          let maxVal = 0, peakY = lineStart;
          for (let py = lineStart; py < y; py++) {
            if (hProj[py] > maxVal) {
              maxVal = hProj[py];
              peakY = py;
            }
          }
          lines.push({ start: lineStart, end: y, peakY, maxVal });
        }
      }
    }
  }
  if (inLine && validH - lineStart >= 6) {
    let maxVal = 0, peakY = lineStart;
    for (let py = lineStart; py < validH; py++) {
      if (hProj[py] > maxVal) {
        maxVal = hProj[py];
        peakY = py;
      }
    }
    lines.push({ start: lineStart, end: validH, peakY, maxVal });
  }

  // 3. Extract 1D horizontal profile for each line (sampled around peak ± 8px)
  for (const line of lines) {
    const prof = new Float32Array(validW);
    const startY = Math.max(0, line.peakY - 8);
    const endY = Math.min(validH - 1, line.peakY + 8);
    for (let x = 60; x < validW - 60; x++) {
      let colSum = 0;
      for (let y = startY; y <= endY; y++) {
        colSum += ink[y * validW + x];
      }
      prof[x] = colSum;
    }

    // Centered profile for ZNCC
    let s = 0, cnt = 0;
    for (let x = 60; x < validW - 60; x++) {
      s += prof[x];
      cnt++;
    }
    const mean = s / cnt;
    let varS = 0;
    const norm = new Float32Array(validW);
    for (let x = 60; x < validW - 60; x++) {
      const v = prof[x] - mean;
      norm[x] = v;
      varS += v * v;
    }
    line.prof = prof;
    line.norm = norm;
    line.std = Math.sqrt(varS);
  }

  return { id, validW, validH, hProj, ink, lines };
}

function matchTwoLines(lineA, lineB) {
  if (lineA.std < 10 || lineB.std < 10) return { zncc: 0, bestDx: 0 };
  let bestZ = -1;
  let bestDx = 0;
  const W = lineA.norm.length;

  for (let dx = -10; dx <= 10; dx++) {
    let cov = 0;
    for (let x = 80; x < W - 80; x++) {
      cov += lineA.norm[x] * lineB.norm[x + dx];
    }
    const z = cov / (lineA.std * lineB.std);
    if (z > bestZ) {
      bestZ = z;
      bestDx = dx;
    }
  }
  return { zncc: bestZ, bestDx };
}

async function run() {
  const names = ['real_7', 'real_6', 'real_5', 'real_4', 'real_3', 'real_2', 'real_1'];
  const images = {};

  for (const name of names) {
    const res = await fetch('/real-img/' + name + '.jpg');
    const blob = await res.blob();
    const bmp = await createImageBitmap(blob);
    images[name] = analyzeImageLines(bmp, name, 32, 32);
    log(`Analyzed ${name}: ${images[name].lines.length} lines detected`);
  }

  // Find all matching line pairs between every pair of images
  const pairMatches = [];

  for (let i = 0; i < names.length; i++) {
    for (let j = i + 1; j < names.length; j++) {
      const imgA = images[names[i]];
      const imgB = images[names[j]];

      const matchedLines = [];
      for (let la = 0; la < imgA.lines.length; la++) {
        for (let lb = 0; lb < imgB.lines.length; lb++) {
          const res = matchTwoLines(imgA.lines[la], imgB.lines[lb]);
          if (res.zncc >= 0.28) {
            const dy = imgA.lines[la].peakY - imgB.lines[lb].peakY;
            matchedLines.push({
              lineA: la,
              peakA: imgA.lines[la].peakY,
              lineB: lb,
              peakB: imgB.lines[lb].peakY,
              dy,
              dx: res.bestDx,
              zncc: parseFloat(res.zncc.toFixed(3))
            });
          }
        }
      }

      if (matchedLines.length > 0) {
        // Group matched lines by dy consistency (within ±6px)
        const dyClusters = new Map();
        for (const m of matchedLines) {
          let foundKey = null;
          for (const key of dyClusters.keys()) {
            if (Math.abs(m.dy - key) <= 6) {
              foundKey = key;
              break;
            }
          }
          if (foundKey !== null) {
            dyClusters.get(foundKey).push(m);
          } else {
            dyClusters.set(m.dy, [m]);
          }
        }

        // Find the most dominant consistent cluster
        let bestCluster = [];
        let bestDy = 0;
        for (const [dy, list] of dyClusters.entries()) {
          if (list.length > bestCluster.length) {
            bestCluster = list;
            bestDy = dy;
          }
        }

        // Calculate average dx and avg zncc in dominant cluster
        let sumDx = 0, sumZ = 0;
        for (const m of bestCluster) {
          sumDx += m.dx;
          sumZ += m.zncc;
        }
        const avgDx = Math.round(sumDx / bestCluster.length);
        const avgZ = sumZ / bestCluster.length;

        // Direction:
        // If bestDy > 0: line in A is lower than line in B.
        // That means A is placed ABOVE B, and its bottom lines match B's top lines! (A_before_B)
        // If bestDy < 0: line in A is higher than line in B.
        // That means B is placed ABOVE A! (B_before_A)
        const direction = bestDy >= 0 ? 'A_before_B' : 'B_before_A';
        const overlapH = bestDy >= 0 ? (imgA.validH - bestDy) : (imgB.validH + bestDy);

        pairMatches.push({
          imgA: imgA.id,
          imgB: imgB.id,
          direction,
          consistentLines: bestCluster.length,
          totalLineMatches: matchedLines.length,
          bestDy,
          avgDx,
          overlapH,
          avgZ: parseFloat(avgZ.toFixed(3)),
          cluster: bestCluster
        });
      }
    }
  }

  pairMatches.sort((a, b) => b.consistentLines - a.consistentLines);
  await log('=== ALL CONSISTENT LINE MATCHES ===', pairMatches);

  await fetch('/test-result', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ ok: true, pairMatches })
  });
}
run();
</script>
</body>
</html>
